name: Update Feature Data

on:
  push:
    branches: [main]
    paths:
      - 'docs/feature-docs.xlsx'
  workflow_dispatch:

concurrency:
  group: update-feature-data
  cancel-in-progress: true

jobs:
  update-json:
    name: xlsx → JSON 변환
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: openpyxl 설치
        run: pip install openpyxl

      - name: feature-data.json 생성
        run: python3 scripts/xlsx-to-json.py

      - name: 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feature-data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: feature-data.json 자동 갱신 [skip ci]"
          git push
